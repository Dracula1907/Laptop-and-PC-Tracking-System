version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: itam-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-itam_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itam_password_secret}
      POSTGRES_DB: ${POSTGRES_DB:-itam_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - itam-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-itam_user} -d ${POSTGRES_DB:-itam_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itam-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-itam_user}:${POSTGRES_PASSWORD:-itam_password_secret}@postgres:5432/${POSTGRES_DB:-itam_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-itam_super_secret_jwt_key_987654321_enterprise}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - itam-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: itam-frontend
    restart: always
    depends_on:
      - backend
    networks:
      - itam-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: itam-nginx
    restart: always
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - frontend
      - backend
    networks:
      - itam-network

networks:
  itam-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
